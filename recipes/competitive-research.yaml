# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
#
# `foundation:zen-architect` is supplied by this SAME entry, transitively:
# bundle.md includes amplifier-foundation. Declaring amplifier-foundation
# separately is a hard AgentCollisionError (verified) -- foundation includes
# this bundle's own browser-tester behavior, so the two closures supply each
# other's agents and the planner refuses to pick a winner.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-researcher"
      - "foundation:zen-architect"
# ---------------------------------------------------------------------------

name: competitive-research
description: |
  Research competitors by visiting their websites and extracting key information.
  Produces a structured comparison report.
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-researcher, foundation:zen-architect. No
#          behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/competitive-research.yaml \
#     context='{"competitors": ["stripe.com", "square.com"], "research_focus": "pricing and features"}'

context:
  competitors: []   # Required: List of competitor domains to research
  research_focus: "pricing, features, and target audience"  # What aspects to focus on

steps:
  - id: research
    agent: browser-tester:browser-researcher
    prompt: |
      Research the following competitors: {{competitors}}
      
      Focus on: {{research_focus}}
      
      For each competitor:
      1. Visit their main website
      2. Navigate to relevant pages (pricing, features, about)
      3. Extract key data points
      4. Take screenshots of important pages as evidence
      
      Compile your findings in a structured format with:
      - Company overview
      - Key features
      - Pricing (if available)
      - Target audience
      - Unique differentiators
      
      Always close the browser between competitors to keep sessions clean.
    output: research_findings

  - id: synthesize
    agent: foundation:zen-architect
    prompt: |
      Based on the competitive research:
      
      {{research_findings}}
      
      Create a competitive analysis report with:
      
      ## Executive Summary
      [Key takeaways in 2-3 sentences]
      
      ## Comparison Matrix
      | Aspect | {{competitors | join(" | ")}} |
      |--------|...|
      
      ## Competitive Positioning
      [Where each competitor positions themselves]
      
      ## Opportunities
      [Gaps in the market based on research]
      
      ## Recommendations
      [Actionable insights]
    output: analysis_report
