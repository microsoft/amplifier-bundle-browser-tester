# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-operator"
# ---------------------------------------------------------------------------

name: verify-deployed-app
description: |
  Verify a deployed web application is working correctly.
  
  WHY BROWSER IS NEEDED:
  - Modern apps are JS-rendered (React/Vue/Angular) - fetch gets empty HTML
  - Requires visual verification - "looks right" means actually seeing it
  - May need authentication - can't just curl a protected page
  - Dynamic content loads after page render
  
  This recipe logs into your app, navigates key pages, and reports any issues.
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-operator. No behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/examples/verify-deployed-app.yaml \
#     context='{"app_url": "https://staging.myapp.com", "login_email": "test@example.com", "login_password": "testpass123"}'

context:
  app_url: ""                    # Required: Base URL of the deployed application
  login_email: ""                # Optional: Email/username for authentication
  login_password: ""             # Optional: Password for authentication
  pages_to_check: ["/dashboard", "/settings"]  # List of paths to verify after login

steps:
  - id: verify
    agent: browser-tester:browser-operator
    prompt: |
      Verify the deployed application at {{app_url}} is working correctly.
      
      ## Step 1: Access and Screenshot Homepage
      1. Navigate to {{app_url}}
      2. Wait for page to fully load (watch for spinners/loading states)
      3. Screenshot: 01-homepage.png
      4. Report what you see - is it the expected landing page or an error?
      
      {% if login_email and login_password %}
      ## Step 2: Authentication
      1. Find and click the login/sign-in link
      2. Screenshot: 02-login-page.png
      3. Fill in credentials:
         - Email: {{login_email}}
         - Password: {{login_password}}
      4. Submit the login form
      5. Wait for redirect
      6. Screenshot: 03-after-login.png
      7. Report: Did login succeed? Any error messages?
      {% endif %}
      
      ## Step 3: Verify Key Pages
      For each page in {{pages_to_check}}:
      1. Navigate to {{app_url}}{page}
      2. Wait for content to load
      3. Screenshot with descriptive name
      4. Check for:
         - Error messages or stack traces
         - Broken layouts or missing content
         - Console errors (if visible)
         - Loading states that never resolve
      
      ## Step 4: Report
      Provide a summary:
      - Overall status: WORKING / ISSUES FOUND / BROKEN
      - Screenshots captured
      - Any problems discovered
      - Specific elements that look wrong
      
      Close the browser when complete.
    output: verification_result
