# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-operator"
# ---------------------------------------------------------------------------

name: check-status-page
description: |
  Check a service's status page for incidents or outages.
  
  WHY BROWSER IS NEEDED:
  - Status pages are often JS-rendered (Statuspage.io, custom React apps)
  - `curl` returns empty template, not actual status
  - Need to see the visual indicators (green/red/yellow)
  - Incident details may be dynamically loaded
  
  Try: curl https://status.vercel.com - you'll get a JS shell, not the actual status.
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-operator. No behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/examples/check-status-page.yaml \
#     context='{"status_url": "https://status.openai.com"}'

context:
  status_url: ""   # Required: URL of the status page to check
  services: []     # Optional: Specific services to check (checks all if empty)

steps:
  - id: check-status
    agent: browser-tester:browser-operator
    prompt: |
      Check the status page at {{status_url}} for any incidents or issues.
      
      ## Instructions
      
      1. Navigate to {{status_url}}
      2. Wait for the page to fully render (status pages are often JS-heavy)
      3. Screenshot: status-page.png
      
      4. Extract the following information:
         - Overall system status (operational, degraded, outage)
         - Individual service statuses
         - Any active incidents with their:
           - Title/description
           - Affected services
           - Start time
           - Current status
         - Any scheduled maintenance
      
      {% if services %}
      5. Specifically check these services: {{services}}
      {% endif %}
      
      6. Look for any recent incidents (last 24-48 hours)
      
      ## Report Format
      
      ### Current Status
      **Overall: [STATUS]**
      
      | Service | Status |
      |---------|--------|
      | ... | ... |
      
      ### Active Incidents
      [List any ongoing issues]
      
      ### Recent Incidents (Last 48h)
      [List recent resolved issues]
      
      ### Scheduled Maintenance
      [Any upcoming maintenance windows]
      
      Close the browser when complete.
    output: status_result
