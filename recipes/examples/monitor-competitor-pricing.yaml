# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-researcher"
# ---------------------------------------------------------------------------

name: monitor-competitor-pricing
description: |
  Check a competitor's pricing page and extract current pricing information.
  
  WHY BROWSER IS NEEDED:
  - Pricing pages are often A/B tested (different users see different prices)
  - Content is frequently JS-rendered
  - Some sites block automated requests (bot detection)
  - Prices may be dynamically loaded or region-specific
  - Need visual context to understand pricing structure
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-researcher. No behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/examples/monitor-competitor-pricing.yaml \
#     context='{"pricing_url": "https://competitor.com/pricing"}'

context:
  pricing_url: ""   # Required: URL of the competitor's pricing page
  compare_to: {}    # Optional: Your product's pricing to compare against

steps:
  - id: capture-pricing
    agent: browser-tester:browser-researcher
    prompt: |
      Research the pricing at {{pricing_url}}
      
      ## Instructions
      
      1. Navigate to {{pricing_url}}
      2. Wait for pricing to fully load (watch for price elements appearing)
      3. Screenshot: competitor-pricing.png
      
      4. Extract ALL pricing information:
         - Plan/tier names
         - Monthly prices
         - Annual prices (and savings percentage)
         - What's included in each tier
         - Any usage limits (users, storage, API calls, etc.)
         - Enterprise/custom pricing indicators
         - Free tier details
         - Trial information
      
      5. Note any:
         - Hidden fees or add-ons
         - "Contact us" pricing
         - Special offers or discounts shown
         - Regional pricing indicators
      
      ## Output Format
      
      ### Pricing Table
      | Plan | Monthly | Annual | Key Features |
      |------|---------|--------|--------------|
      | ... | ... | ... | ... |
      
      ### Plan Details
      [Detailed breakdown of each plan]
      
      ### Notable Observations
      - [Pricing strategy observations]
      - [Comparison to market]
      - [Any unusual terms]
      
      {% if compare_to %}
      ### Comparison to Your Pricing
      [How this compares to: {{compare_to}}]
      {% endif %}
      
      Close the browser when complete.
    output: pricing_data
