# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-operator"
# ---------------------------------------------------------------------------

name: quick-demo
description: |
  Quick demo showing browser automation in action.
  Fetches live content from Hacker News that requires seeing the rendered page.
  
  Run this first to see the browser bundle working!
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-operator. No behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/examples/quick-demo.yaml

context: {}

steps:
  - id: demo
    agent: browser-tester:browser-operator
    prompt: |
      Demonstrate browser automation by fetching live content from Hacker News
      using the agent-browser CLI.
      
      ## Browser Commands (via bash)
      
      ```bash
      agent-browser open <url>        # Navigate to URL
      agent-browser snapshot -ic      # Get page structure with refs
      agent-browser screenshot <file> # Capture screenshot
      agent-browser click @<ref>      # Click element
      agent-browser get text @<ref>   # Extract text
      agent-browser close             # Close browser
      ```
      
      ## Instructions
      
      1. Navigate to https://news.ycombinator.com:
         ```bash
         agent-browser open "https://news.ycombinator.com"
         ```
      
      2. Take a snapshot to see the page structure:
         ```bash
         agent-browser snapshot -ic
         ```
      
      3. Screenshot the page:
         ```bash
         agent-browser screenshot hackernews.png
         ```
      
      4. Extract the top 5 stories:
         - Rank
         - Title
         - Points
         - Author
         - Number of comments
         - Link URL
      
      5. For the #1 story, click through to the comments page and:
         - Screenshot: top-story-comments.png
         - Report how many comments it has
         - Summarize the top 2-3 comments
      
      ## Output Format
      
      ### Top 5 Hacker News Stories (Live)
      
      | # | Title | Points | Comments |
      |---|-------|--------|----------|
      | 1 | ... | ... | ... |
      | 2 | ... | ... | ... |
      | 3 | ... | ... | ... |
      | 4 | ... | ... | ... |
      | 5 | ... | ... | ... |
      
      ### #1 Story Deep Dive
      **Title**: [title]
      **Discussion highlights**: [summary of top comments]
      
      ---
      *Captured live at [timestamp]*
      
      Close the browser when complete.
    output: demo_result
