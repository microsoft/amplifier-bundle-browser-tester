# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ----------
# schema_version 2 makes this recipe portable: every `agent:` reference below
# resolves ONLY from the declared closure here, never from the calling
# session's agent map. A caller bundle that does not carry these agents can
# still run it.
#
# SOURCING -- this bundle's own agents come from a SELF-REFERENTIAL entry.
# The runner never infers a dependency from an agent's namespace prefix
# (manifest.v1 Core 11), so `browser-tester:*` must be declared explicitly
# even though this recipe ships inside the browser-tester bundle.
#
# The pin is `@main`, not the sha `5af96c6`: Foundation fetches a ref with
# `git clone --branch`, which accepts a branch or a tag but NOT a commit sha
# (verified: `@5af96c6` fails "Remote branch 5af96c6 not found in upstream
# origin"), and this repo carries no tags. `@main` currently resolves to
# 5af96c6d2e983ed408bea81bf63b23fb60933da9 -- the intended commit.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-bundle-browser-tester@main"
    kind: bundle
    required_agents:
      - "browser-tester:browser-operator"
# ---------------------------------------------------------------------------

name: extract-dynamic-content
description: |
  Extract content from JavaScript-rendered pages (React, Vue, Angular apps).
  
  WHY BROWSER IS NEEDED:
  - Modern web apps render content client-side with JavaScript
  - Fetching the HTML returns just: <div id="root"></div>
  - The actual content requires JS execution to appear
  - APIs may not exist or be documented for the data you need
  
  Example: Try `curl https://news.ycombinator.com` vs a React app - HN works,
  but most modern apps return empty shells.
version: "1.1.0"
#
# CHANGELOG:
# v1.1.0 - Declare schema_version 2 + dependency manifest so this recipe runs
#          from ANY session bundle instead of only one that happens to carry
#          browser-tester:browser-operator. No behavior change to the steps.

# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@browser-tester:recipes/examples/extract-dynamic-content.yaml \
#     context='{"url": "https://example.com/dashboard", "extract": "all product cards with name, price, and rating"}'

context:
  url: ""          # Required: URL of the page with dynamic content
  extract: ""      # Required: Description of what data to extract
  wait_for: ""     # Optional: Element to wait for before extracting

steps:
  - id: extract
    agent: browser-tester:browser-operator
    prompt: |
      Extract dynamic content from {{url}}
      
      ## The Problem
      This page likely uses JavaScript to render its content. A simple HTTP fetch
      would return an empty shell. We need a real browser to execute the JS and
      see the actual content.
      
      ## Instructions
      
      1. Navigate to {{url}}
      
      2. Wait for content to load:
         {% if wait_for %}
         - Specifically wait for: {{wait_for}}
         {% else %}
         - Watch for loading spinners to disappear
         - Wait for main content to appear
         - May need to scroll to trigger lazy loading
         {% endif %}
      
      3. Get a snapshot to see the rendered content:
         ```
         agent-browser snapshot -ic
         ```
      
      4. Extract: {{extract}}
         - Use `get text @ref` for specific elements
         - Capture structured data
      
      5. Screenshot the page for reference: extracted-content.png
      
      ## Output Format
      
      ### Extracted Data
      [Structured extraction of requested data]
      
      ### Source
      - URL: {{url}}
      - Captured at: [timestamp]
      
      ### Notes
      [Any issues with extraction, missing data, etc.]
      
      Close the browser when complete.
    output: extracted_data
